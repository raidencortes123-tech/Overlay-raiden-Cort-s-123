<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>Aitum Vertical Overlay - Ruined Style Refined</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruined: {
                            cyan: '#00ffcc',
                            mint: '#3affcf',
                            dark: '#030a0a',
                            panel: 'rgba(5, 16, 16, 0.92)',
                            glow: 'rgba(0, 255, 204, 0.35)'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            color: #e2fdf8;
        }

        /* Panel Glassmorphism con fondo oscuro y opaco para alto contraste */
        .glass-panel {
            background: rgba(4, 12, 12, 0.88);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.45);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.85), inset 0 0 16px rgba(0, 255, 204, 0.18);
        }

        /* Marcos opacos oscuros para encuadrar cámara y juego */
        .frame-placeholder {
            background: rgba(2, 10, 10, 0.75);
            border: 2px solid rgba(0, 255, 204, 0.5);
        }

        /* Esquinas metálicas decorativas */
        .corner-ornament {
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: #00ffcc;
            pointer-events: none;
            filter: drop-shadow(0 0 5px #00ffcc);
            z-index: 10;
        }
        .corner-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

        .glow-text {
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8);
        }

        /* Animación de resplandor atenuado */
        @keyframes subtlePulse {
            0%, 100% { filter: drop-shadow(0 0 4px rgba(0, 255, 204, 0.4)); }
            50% { filter: drop-shadow(0 0 10px rgba(0, 255, 204, 0.8)); }
        }

        .pulse-border {
            animation: subtlePulse 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="w-[1080px] h-[1920px] relative overflow-hidden bg-transparent">

    <div class="w-[1080px] h-[1920px] p-8 flex flex-col justify-between items-center relative z-10 pointer-events-none">

        <!-- 1. TERCIO SUPERIOR: CÁMARA + ETIQUETA / BANNER DE NOMBRE -->
        <div class="flex flex-col items-center w-full gap-4 mt-6">
            
            <!-- MARCO TRANSPARENTE/OPACO PARA CÁMARA CON CORNER ORNAMENTS Y BORDES DEFINIDOS -->
            <div id="camFrame" class="glass-panel frame-placeholder w-[820px] h-[520px] rounded-2xl relative flex items-center justify-center pulse-border">
                <div class="corner-ornament corner-tl w-5 h-5"></div>
                <div class="corner-ornament corner-tr w-5 h-5"></div>
                <div class="corner-ornament corner-bl w-5 h-5"></div>
                <div class="corner-ornament corner-br w-5 h-5"></div>
            </div>

            <!-- ETIQUETA / BANNER DE NOMBRE DEL STREAMER (SUPERPUESTO ABAJO DE LA CÁMARA) -->
            <div class="glass-panel px-9 py-3.5 rounded-xl flex items-center gap-3.5 relative -mt-9 z-20 shadow-2xl border-2 border-ruined-cyan/60">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>
                <i class="fa-solid fa-dragon text-ruined-cyan text-2xl"></i>
                <span class="font-cinzel text-2xl font-black text-white tracking-widest glow-text">@RAIDENCORTES123</span>
            </div>

        </div>

        <!-- 2. CENTRO: MARCO PARA JUEGO EN PROPORCIÓN 16:9 EXACTA (1000px x 562.5px) -->
        <div id="gameFrame" class="glass-panel frame-placeholder w-[1000px] h-[562.5px] rounded-2xl relative flex items-center justify-center pulse-border">
            <div class="corner-ornament corner-tl w-5 h-5"></div>
            <div class="corner-ornament corner-tr w-5 h-5"></div>
            <div class="corner-ornament corner-bl w-5 h-5"></div>
            <div class="corner-ornament corner-br w-5 h-5"></div>
        </div>

        <!-- 3. PIE DE PÁGINA: REDES SOCIALES UNIFICADAS CON ESTILO RUINED GLASS -->
        <div class="mb-6">
            <div class="glass-panel px-9 py-4 rounded-xl flex items-center gap-6 relative font-rajdhani font-bold text-base border-2 border-ruined-cyan/50 shadow-2xl">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>

                <!-- YouTube -->
                <div class="flex items-center gap-2.5 text-white">
                    <i class="fa-brands fa-youtube text-red-500 text-xl"></i>
                    <span class="text-lg">@raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- Twitch -->
                <div class="flex items-center gap-2.5 text-white">
                    <i class="fa-brands fa-twitch text-purple-400 text-xl"></i>
                    <span class="text-lg">raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- Instagram -->
                <div class="flex items-center gap-2.5 text-white">
                    <i class="fa-brands fa-instagram text-pink-500 text-xl"></i>
                    <span class="text-lg">raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- X (Twitter) -->
                <div class="flex items-center gap-2.5 text-white">
                    <svg class="w-4 h-4 fill-current text-ruined-cyan" viewBox="0 0 24 24">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    <span class="text-lg">@RaidenCortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- TikTok -->
                <div class="flex items-center gap-2.5 text-white">
                    <i class="fa-brands fa-tiktok text-ruined-cyan text-xl"></i>
                    <span class="text-lg">@raiden_cortes_123</span>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
