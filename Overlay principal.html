<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080, initial-scale=1.0">
    <title>In-Game Overlay Transparent - Raiden Cortés</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rajdhani:wght@600;700&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruined: {
                            cyan: '#00ffcc',
                            mint: '#3affcf',
                            dark: 'rgba(8, 18, 18, 0.75)',
                            glow: 'rgba(0, 255, 204, 0.25)'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body, html {
            width: 1920px;
            height: 1080px;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: transparent;
            font-family: 'Rajdhani', sans-serif;
            color: #e2fdf8;
        }

        /* Panel Glassmorphism con desenfoque para separar del juego */
        .glass-panel {
            background: rgba(6, 15, 15, 0.75);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 204, 0.35);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5), inset 0 0 12px rgba(0, 255, 204, 0.1);
        }

        /* Esquinas metálicas decorativas */
        .corner-ornament {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: #00ffcc;
            pointer-events: none;
            filter: drop-shadow(0 0 3px #00ffcc);
        }
        .corner-tl { top: -2px; left: -2px; border-top: 2px solid; border-left: 2px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 2px solid; border-right: 2px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 2px solid; border-left: 2px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 2px solid; border-right: 2px solid; }

        .glow-text {
            text-shadow: 0 0 8px rgba(0, 255, 204, 0.6);
        }
    </style>
</head>
<body class="w-[1920px] h-[1080px] relative overflow-hidden bg-transparent">

    <div class="w-[1920px] h-[1080px] p-6 flex flex-col justify-between relative z-10 pointer-events-none">

        <!-- 1. ENCABEZADO: ÚNICAMENTE NOMBRE DEL STREAMER (LIBERANDO TODO EL TOP DEL JUEGO) -->
        <header class="w-full flex justify-start items-center">
            
            <!-- Nombre del Streamer -->
            <div class="glass-panel px-5 py-2.5 rounded-xl flex items-center gap-3 relative">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>
                <i class="fa-solid fa-dragon text-ruined-cyan text-xl"></i>
                <span class="font-cinzel text-base font-bold text-white tracking-wider glow-text">RAIDEN CORTES</span>
            </div>

        </header>

        <!-- 2. ZONA INFERIOR: MÉTRICAS BAJADAS + REDES EN EL CENTRO + MÓDULO CÁMARA/SOREN -->
        <footer class="w-full flex justify-between items-end gap-4">
            
            <!-- Espacio Vacío Izquierdo (Mantiene equilibrio visual) -->
            <div class="w-[200px]"></div>

            <!-- REDES SOCIALES EN MEDIO DE LA PANTALLA (ABAJO) -->
            <div class="glass-panel px-6 py-2.5 rounded-xl flex items-center gap-4 relative font-rajdhani font-bold text-sm">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>

                <!-- YouTube -->
                <div class="flex items-center gap-1.5 text-white">
                    <i class="fa-brands fa-youtube text-red-500 text-base"></i>
                    <span>@raidencortes123</span>
                </div>

                <div class="h-3.5 w-[1px] bg-ruined-cyan/30"></div>

                <!-- Twitch -->
                <div class="flex items-center gap-1.5 text-white">
                    <i class="fa-brands fa-twitch text-purple-400 text-base"></i>
                    <span>raidencortes123</span>
                </div>

                <div class="h-3.5 w-[1px] bg-ruined-cyan/30"></div>

                <!-- Instagram -->
                <div class="flex items-center gap-1.5 text-white">
                    <i class="fa-brands fa-instagram text-pink-500 text-base"></i>
                    <span>raidencortes123</span>
                </div>

                <div class="h-3.5 w-[1px] bg-ruined-cyan/30"></div>

                <!-- X (Twitter) -->
                <div class="flex items-center gap-1.5 text-white">
                    <svg class="w-3.5 h-3.5 fill-current text-ruined-cyan" viewBox="0 0 24 24">
                        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/>
                    </svg>
                    <span>@RaidenCortes123</span>
                </div>

                <div class="h-3.5 w-[1px] bg-ruined-cyan/30"></div>

                <!-- TikTok -->
                <div class="flex items-center gap-1.5 text-white">
                    <i class="fa-brands fa-tiktok text-ruined-cyan text-base"></i>
                    <span>@raiden_cortes_123</span>
                </div>
            </div>

            <!-- COLUMNA DERECHA INFERIOR: MÉTRICAS REUBICADAS Y MÓDULO CÁMARA+SOREN -->
            <div class="flex flex-col items-end gap-3">
                
                <!-- Contenedores para Métricas (480px x 100px) Bajados de Nivel -->
                <div class="flex flex-col gap-2.5">
                    <!-- Marco Métrica 1 (Suscriptores) -->
                    <div class="glass-panel w-[480px] h-[100px] rounded-xl relative">
                        <div class="corner-ornament corner-tl border-l-2 border-t-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-tr border-r-2 border-t-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-bl border-l-2 border-b-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-br border-r-2 border-b-2 w-3.5 h-3.5"></div>
                    </div>

                    <!-- Marco Métrica 2 (Seguidores / Goal) -->
                    <div class="glass-panel w-[480px] h-[100px] rounded-xl relative">
                        <div class="corner-ornament corner-tl border-l-2 border-t-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-tr border-r-2 border-t-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-bl border-l-2 border-b-2 w-3.5 h-3.5"></div>
                        <div class="corner-ornament corner-br border-r-2 border-b-2 w-3.5 h-3.5"></div>
                    </div>
                </div>

                <!-- MÓDULO INFERIOR DERECHO: CÁMARA + SOREN -->
                <div class="glass-panel p-3 rounded-2xl relative flex flex-col items-end gap-2.5 border-2 border-ruined-cyan/40">
                    <div class="corner-ornament corner-tl w-3 h-3 border-t-2 border-l-2"></div>
                    <div class="corner-ornament corner-tr w-3 h-3 border-t-2 border-r-2"></div>
                    <div class="corner-ornament corner-bl w-3 h-3 border-b-2 border-l-2"></div>
                    <div class="corner-ornament corner-br w-3 h-3 border-b-2 border-r-2"></div>

                    <!-- MARCO TRANSPARENTE PARA CÁMARA / AVATAR -->
                    <div class="w-[365px] h-[220px] rounded-xl relative overflow-hidden bg-transparent border border-ruined-cyan/20">
                    </div>

                    <!-- MARCO TRANSPARENTE EXACTO PARA SOREN (365px x 250px) -->
                    <div class="w-[365px] h-[250px] bg-black/40 rounded-xl border border-ruined-cyan/30 relative overflow-hidden">
                        <div class="corner-ornament corner-tl border-l border-t"></div>
                        <div class="corner-ornament corner-tr border-r border-t"></div>
                        <div class="corner-ornament corner-bl border-l border-b"></div>
                        <div class="corner-ornament corner-br border-r border-b"></div>
                    </div>
                </div>

            </div>

        </footer>

    </div>

</body>
</html>
