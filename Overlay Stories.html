<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>Story Overlay - Raiden Cortes</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;800;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruined: {
                            cyan: '#00ffcc',
                            mint: '#3affcf',
                            dark: '#030a0a',
                            deep: '#011514',
                            glow: 'rgba(0, 255, 204, 0.35)'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: #030a0a;
            font-family: 'Rajdhani', sans-serif;
            color: #e2fdf8;
        }

        /* FONDO ESTILIZADO SHYVANA ARRUINADA */
        .ruined-bg {
            background: 
                radial-gradient(circle at 50% 18%, rgba(0, 255, 204, 0.22) 0%, transparent 50%),
                radial-gradient(circle at 50% 82%, rgba(0, 255, 204, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 10% 50%, rgba(1, 21, 20, 0.92) 0%, transparent 45%),
                radial-gradient(circle at 90% 50%, rgba(1, 21, 20, 0.92) 0%, transparent 45%),
                #020808;
        }

        /* Malla / Red visual */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 255, 204, 0.045) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 204, 0.045) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* Panel Glassmorphism Cyberpunk */
        .glass-panel {
            background: rgba(4, 16, 16, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(0, 255, 204, 0.55);
            box-shadow: 0 12px 48px 0 rgba(0, 0, 0, 0.92), inset 0 0 24px rgba(0, 255, 204, 0.2);
        }

        /* Esquinas metálicas decorativas */
        .corner-ornament {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #00ffcc;
            pointer-events: none;
            filter: drop-shadow(0 0 8px #00ffcc);
            z-index: 10;
        }
        .corner-tl { top: -2px; left: -2px; border-top: 4px solid; border-left: 4px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 4px solid; border-right: 4px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 4px solid; border-left: 4px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 4px solid; border-right: 4px solid; }

        .glow-cyan {
            text-shadow: 0 0 16px rgba(0, 255, 204, 0.9), 0 0 32px rgba(0, 255, 204, 0.5);
        }

        @keyframes subtlePulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(0, 255, 204, 0.45)); }
            50% { filter: drop-shadow(0 0 22px rgba(0, 255, 204, 0.9)); }
        }

        .pulse-border {
            animation: subtlePulse 3.5s infinite ease-in-out;
        }

        /* Aura Mística de fondo */
        .mist-aura {
            position: absolute;
            width: 900px;
            height: 900px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.09) 0%, rgba(0, 255, 204, 0) 70%);
            pointer-events: none;
            top: 45%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: mistFloat 6s ease-in-out infinite alternate;
        }

        @keyframes mistFloat {
            0% { transform: translate(-50%, -52%) scale(0.95); opacity: 0.6; }
            100% { transform: translate(-50%, -48%) scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body class="w-[1080px] h-[1920px] relative overflow-hidden ruined-bg cyber-grid">

    <!-- EFECTO AURA DE NIEBLA DE FONDO -->
    <div class="mist-aura"></div>

    <div class="w-[1080px] h-[1920px] pt-12 pb-12 px-8 flex flex-col justify-between items-center relative z-10">

        <!-- 1. HEADER SUPERIOR CON ICONO Y TEXTO PERFECTAMENTE AGRUPADOS Y CENTRADOS -->
        <div class="w-[980px] flex flex-col items-center">
            
            <!-- Emblema de Dragón Centrado -->
            <div class="mb-3 flex items-center justify-center gap-5 w-full">
                <div class="h-[3px] w-40 bg-gradient-to-r from-transparent to-ruined-cyan"></div>
                <i class="fa-solid fa-dragon text-ruined-cyan text-6xl glow-cyan"></i>
                <div class="h-[3px] w-40 bg-gradient-to-l from-transparent to-ruined-cyan"></div>
            </div>

            <!-- PANEL CABECERA -->
            <div class="glass-panel w-full py-9 px-8 rounded-3xl relative flex flex-col items-center text-center gap-4 pulse-border border-2 border-ruined-cyan">
                <div class="corner-ornament corner-tl w-7 h-7"></div>
                <div class="corner-ornament corner-tr w-7 h-7"></div>
                <div class="corner-ornament corner-bl w-7 h-7"></div>
                <div class="corner-ornament corner-br w-7 h-7"></div>

                <!-- DÍA DE LA SEMANA + ICONO PEGADOS Y CENTRADOS EN CONJUNTO -->
                <div class="flex items-center justify-center gap-5 w-full">
                    <i class="fa-solid fa-calendar-day text-ruined-cyan text-5xl glow-cyan"></i>
                    <span id="currentDay" class="font-orbitron text-5xl font-black tracking-wider text-white uppercase glow-cyan leading-tight text-center">
                        CARGANDO...
                    </span>
                </div>

                <div class="w-full h-[1px] bg-gradient-to-r from-transparent via-ruined-cyan/40 to-transparent my-1"></div>

                <!-- RECORDATORIO DEL DIRECTO -->
                <div class="flex items-center justify-center gap-4 text-center w-full">
                    <i class="fa-brands fa-twitch text-purple-400 text-5xl"></i>
                    <p class="font-rajdhani text-4xl font-extrabold text-white tracking-wide">
                        HOY HAY DIRECTO A LAS <span class="text-ruined-cyan underline font-black text-5xl">10:00 PM</span> <span class="text-2xl text-ruined-cyan/80">(CDMX)</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- 2. MARCO DE CÁMARA TRANSPARENTE CON MÁS ALTURA (680px) -->
        <div class="glass-panel w-[980px] h-[680px] rounded-3xl relative pulse-border bg-transparent border-2 border-ruined-cyan/60">
            <div class="corner-ornament corner-tl w-7 h-7"></div>
            <div class="corner-ornament corner-tr w-7 h-7"></div>
            <div class="corner-ornament corner-bl w-7 h-7"></div>
            <div class="corner-ornament corner-br w-7 h-7"></div>

            <!-- Bisel interno de detalle -->
            <div class="absolute inset-2 border border-ruined-cyan/30 rounded-2xl pointer-events-none"></div>
        </div>

        <!-- 3. FOOTER INFERIOR: REDES SOCIALES -->
        <div class="w-[980px]">
            <div class="glass-panel py-7 px-8 rounded-3xl relative border-2 border-ruined-cyan/60 shadow-2xl">
                <div class="corner-ornament corner-tl w-6 h-6"></div>
                <div class="corner-ornament corner-tr w-6 h-6"></div>
                <div class="corner-ornament corner-bl w-6 h-6"></div>
                <div class="corner-ornament corner-br w-6 h-6"></div>

                <div class="grid grid-cols-2 gap-y-5 gap-x-8 font-rajdhani font-extrabold text-3xl">
                    <!-- YouTube -->
                    <div class="flex items-center justify-center gap-4 text-white bg-ruined-dark/60 py-4 rounded-2xl border border-ruined-cyan/30">
                        <i class="fa-brands fa-youtube text-red-500 text-4xl"></i>
                        <span>@raidencortes123</span>
                    </div>

                    <!-- Twitch -->
                    <div class="flex items-center justify-center gap-4 text-white bg-ruined-dark/60 py-4 rounded-2xl border border-ruined-cyan/30">
                        <i class="fa-brands fa-twitch text-purple-400 text-4xl"></i>
                        <span>raidencortes123</span>
                    </div>

                    <!-- Instagram -->
                    <div class="flex items-center justify-center gap-4 text-white bg-ruined-dark/60 py-4 rounded-2xl border border-ruined-cyan/30">
                        <i class="fa-brands fa-instagram text-pink-500 text-4xl"></i>
                        <span>raidencortes123</span>
                    </div>

                    <!-- TikTok -->
                    <div class="flex items-center justify-center gap-4 text-white bg-ruined-dark/60 py-4 rounded-2xl border border-ruined-cyan/30">
                        <i class="fa-brands fa-tiktok text-ruined-cyan text-4xl"></i>
                        <span>@raiden_cortes_123</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT JS PARA FECHA AUTOMÁTICA -->
    <script>
        function updateCyberpunkHeader() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            
            let dateString = now.toLocaleDateString('es-MX', options).toUpperCase();
            
            document.getElementById('currentDay').innerText = dateString;
        }

        updateCyberpunkHeader();
        setInterval(updateCyberpunkHeader, 60000);
    </script>
</body>
</html>
