<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920, initial-scale=1.0">
    <title>Story Overlay - Ruined Shyvana Theme</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Rajdhani:wght@600;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        ruined: {
                            cyan: '#00ffcc',
                            mint: '#3affcf',
                            dark: '#030a0a',
                            deep: '#011514',
                            glow: 'rgba(0, 255, 204, 0.35)'
                        }
                    },
                    fontFamily: {
                        orbitron: ['Orbitron', 'sans-serif'],
                        rajdhani: ['Rajdhani', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 1080px;
            height: 1920px;
            overflow: hidden;
            background-color: #030a0a;
            font-family: 'Rajdhani', sans-serif;
            color: #e2fdf8;
        }

        /* FONDO ESTILIZADO SHYVANA ARRUINADA */
        .ruined-bg {
            background: 
                radial-gradient(circle at 50% 15%, rgba(0, 255, 204, 0.15) 0%, transparent 55%),
                radial-gradient(circle at 50% 85%, rgba(0, 255, 204, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 10% 50%, rgba(3, 30, 30, 0.8) 0%, transparent 40%),
                radial-gradient(circle at 90% 50%, rgba(3, 30, 30, 0.8) 0%, transparent 40%),
                #020808;
        }

        /* Red visual sutil de fondo */
        .cyber-grid {
            background-image: 
                linear-gradient(to right, rgba(0, 255, 204, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 204, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        /* Panel Glassmorphism Cyberpunk */
        .glass-panel {
            background: rgba(4, 16, 16, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 255, 204, 0.45);
            box-shadow: 0 10px 40px 0 rgba(0, 0, 0, 0.9), inset 0 0 20px rgba(0, 255, 204, 0.15);
        }

        /* Esquinas metálicas / místicas decorativas */
        .corner-ornament {
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: #00ffcc;
            pointer-events: none;
            filter: drop-shadow(0 0 6px #00ffcc);
            z-index: 10;
        }
        .corner-tl { top: -2px; left: -2px; border-top: 3px solid; border-left: 3px solid; }
        .corner-tr { top: -2px; right: -2px; border-top: 3px solid; border-right: 3px solid; }
        .corner-bl { bottom: -2px; left: -2px; border-bottom: 3px solid; border-left: 3px solid; }
        .corner-br { bottom: -2px; right: -2px; border-bottom: 3px solid; border-right: 3px solid; }

        .glow-cyan {
            text-shadow: 0 0 12px rgba(0, 255, 204, 0.8), 0 0 24px rgba(0, 255, 204, 0.4);
        }

        @keyframes subtlePulse {
            0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 255, 204, 0.4)); }
            50% { filter: drop-shadow(0 0 16px rgba(0, 255, 204, 0.85)); }
        }

        .pulse-border {
            animation: subtlePulse 3.5s infinite ease-in-out;
        }

        /* Aura mística central estilo Niebla Arruinada */
        .mist-aura {
            position: absolute;
            width: 700px;
            height: 700px;
            background: radial-gradient(circle, rgba(0, 255, 204, 0.07) 0%, rgba(0, 255, 204, 0) 70%);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: mistFloat 6s ease-in-out infinite alternate;
        }

        @keyframes mistFloat {
            0% { transform: translate(-50%, -52%) scale(0.95); opacity: 0.6; }
            100% { transform: translate(-50%, -48%) scale(1.05); opacity: 1; }
        }
    </style>
</head>
<body class="w-[1080px] h-[1920px] relative overflow-hidden ruined-bg cyber-grid">

    <!-- AURA Y LUZ DE NIEBLA DE FONDO -->
    <div class="mist-aura"></div>

    <div class="w-[1080px] h-[1920px] p-8 flex flex-col justify-between items-center relative z-10">

        <!-- 1. PARTE SUPERIOR: CABECERA CON ICONOGRAFÍA RUINED Y FECHA DINÁMICA -->
        <div class="w-[960px] flex flex-col items-center mt-6">
            
            <!-- Emblema superior (Dragón / Corona Arruinada) -->
            <div class="mb-3 flex items-center justify-center gap-3">
                <div class="h-[2px] w-24 bg-gradient-to-r from-transparent to-ruined-cyan"></div>
                <i class="fa-solid fa-dragon text-ruined-cyan text-4xl glow-cyan"></i>
                <div class="h-[2px] w-24 bg-gradient-to-l from-transparent to-ruined-cyan"></div>
            </div>

            <div class="glass-panel w-full py-6 px-8 rounded-2xl relative border-2 border-ruined-cyan/60 flex flex-col items-center gap-2 pulse-border">
                <div class="corner-ornament corner-tl w-5 h-5"></div>
                <div class="corner-ornament corner-tr w-5 h-5"></div>
                <div class="corner-ornament corner-bl w-5 h-5"></div>
                <div class="corner-ornament corner-br w-5 h-5"></div>

                <!-- DÍA DE LA SEMANA DINÁMICO -->
                <div class="flex items-center gap-3">
                    <i class="fa-solid fa-calendar-day text-ruined-cyan text-2xl"></i>
                    <span id="currentDay" class="font-orbitron text-3xl font-black tracking-widest text-white uppercase glow-cyan">
                        CARGANDO...
                    </span>
                </div>

                <!-- RECORDATORIO DEL DIRECTO -->
                <div class="flex items-center gap-3 mt-1 text-center">
                    <i class="fa-brands fa-twitch text-purple-400 text-2xl"></i>
                    <p class="font-rajdhani text-2xl font-bold text-white tracking-wide">
                        HOY HAY DIRECTO A LAS <span class="text-ruined-cyan font-extrabold underline">10:00 PM</span> <span class="text-xs text-ruined-cyan/80">(CDMX)</span>
                    </p>
                </div>
            </div>
        </div>

        <!-- 2. ZONA CENTRAL: MARCO DE CONTENIDO / CÁMARA O REPRODUCTOR -->
        <div class="glass-panel w-[980px] h-[1220px] rounded-3xl relative pulse-border bg-transparent border-2 border-ruined-cyan/40">
            <div class="corner-ornament corner-tl w-6 h-6"></div>
            <div class="corner-ornament corner-tr w-6 h-6"></div>
            <div class="corner-ornament corner-bl w-6 h-6"></div>
            <div class="corner-ornament corner-br w-6 h-6"></div>

            <!-- Detalle estético sutil de bisel interno -->
            <div class="absolute inset-3 border border-ruined-cyan/20 rounded-2xl pointer-events-none"></div>
        </div>

        <!-- 3. PIE DE PÁGINA: REDES SOCIALES -->
        <div class="mb-6">
            <div class="glass-panel px-9 py-4 rounded-xl flex items-center gap-6 relative font-rajdhani font-bold text-base border-2 border-ruined-cyan/50 shadow-2xl">
                <div class="corner-ornament corner-tl"></div>
                <div class="corner-ornament corner-tr"></div>
                <div class="corner-ornament corner-bl"></div>
                <div class="corner-ornament corner-br"></div>

                <!-- YouTube -->
                <div class="flex items-center gap-2 text-white">
                    <i class="fa-brands fa-youtube text-red-500 text-xl"></i>
                    <span class="text-lg">@raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- Twitch -->
                <div class="flex items-center gap-2 text-white">
                    <i class="fa-brands fa-twitch text-purple-400 text-xl"></i>
                    <span class="text-lg">raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- Instagram -->
                <div class="flex items-center gap-2 text-white">
                    <i class="fa-brands fa-instagram text-pink-500 text-xl"></i>
                    <span class="text-lg">raidencortes123</span>
                </div>

                <div class="h-5 w-[1.5px] bg-ruined-cyan/40"></div>

                <!-- TikTok -->
                <div class="flex items-center gap-2 text-white">
                    <i class="fa-brands fa-tiktok text-ruined-cyan text-xl"></i>
                    <span class="text-lg">@raiden_cortes_123</span>
                </div>
            </div>
        </div>

    </div>

    <!-- SCRIPT JS PARA ACTUALIZAR DÍA AUTOMÁTICAMENTE -->
    <script>
        function updateCyberpunkHeader() {
            const now = new Date();
            const options = { weekday: 'long', day: 'numeric', month: 'long' };
            
            // Obtener el día formateado en español (Ej: MARTES, 22 DE SEPTIEMBRE)
            let dateString = now.toLocaleDateString('es-MX', options).toUpperCase();
            
            document.getElementById('currentDay').innerText = dateString;
        }

        updateCyberpunkHeader();
        // Se actualiza cada minuto
        setInterval(updateCyberpunkHeader, 60000);
    </script>
</body>
</html>
